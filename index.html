<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Client</title>
  <style>
    :root {
      --bg-a: #f5f7fb;
      --bg-b: #e9eff8;
      --card: #ffffff;
      --text: #172033;
      --muted: #5c6b86;
      --primary: #0f62fe;
      --primary-hover: #0b53d7;
      --border: #d5deef;
      --shadow: 0 20px 50px rgba(23, 32, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #ffffff 0%, var(--bg-a) 35%, var(--bg-b) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.35rem;
      letter-spacing: 0.2px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    #question {
      flex: 1;
      font-size: 1rem;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    #question:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.15);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 0.96rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: background 120ms ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #answer {
      margin-top: 14px;
      min-height: 64px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      color: var(--muted);
      background: #fbfcff;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    #meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    #data {
      margin: 12px 0 0;
      padding-left: 20px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ask a Question</h1>
    <div class="stack">
      <div class="row">
        <input id="question" type="text" placeholder="Type your question..." />
        <button id="send" type="button">Send</button>
      </div>
    </div>
    <div id="answer">Your answer will appear here.</div>
    <div id="meta"></div>
    <ul id="data"></ul>
  </main>

  <script>
    const HISTORY_WINDOW = 4;
    const chatHistory = [];

    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const answerBox = document.getElementById("answer");
    const metaBox = document.getElementById("meta");
    const dataBox = document.getElementById("data");

    function renderStructuredData(data) {
      dataBox.innerHTML = "";
      if (!data || typeof data !== "object") {
        return;
      }

      const records = [];
      if (Array.isArray(data.products)) {
        records.push(...data.products);
      }
      for (const key of ["product", "stock", "price"]) {
        if (data[key] && typeof data[key] === "object") {
          records.push(data[key]);
        }
      }

      if (records.length === 0) {
        return;
      }

      for (const product of records) {
        const item = document.createElement("li");
        item.textContent = formatProductRecord(product);
        dataBox.appendChild(item);
      }
    }

    function firstValue(record, keys, fallback = "n/a") {
      for (const key of keys) {
        const value = record[key];
        if (value !== undefined && value !== null && value !== "") {
          return value;
        }
      }
      return fallback;
    }

    function formatMoney(value) {
      if (value === "n/a") return value;
      const numberValue = Number(value);
      if (!Number.isFinite(numberValue)) return value;
      return `${Math.round(numberValue).toLocaleString("hu-HU")} Ft`;
    }

    function formatProductRecord(product) {
      const name = firstValue(product, ["name", "ProductName"], "Unknown product");
      const id = firstValue(product, ["product_id", "ProductId", "id"], "n/a");
      const sku = firstValue(product, ["sku", "SKU", "ProductSku"]);
      const category = firstValue(product, ["categories", "category"]);
      const status = firstValue(product, ["availability_status"]);
      const price = firstValue(product, ["price", "average_price", "BasePrice"]);
      const ordered = firstValue(product, ["quantity_ordered", "QuantityOrdered"]);

      const parts = [`${name} (ID: ${id})`];
      if (sku !== "n/a") parts.push(`SKU: ${sku}`);
      if (category !== "n/a") parts.push(`Category: ${category}`);
      if (price !== "n/a") parts.push(`Price: ${formatMoney(price)}`);
      if (ordered !== "n/a") parts.push(`Ordered: ${ordered}`);
      if (status !== "n/a") parts.push(`Status: ${status}`);

      return parts.join(" | ");
    }

    async function askQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      sendButton.disabled = true;
      answerBox.textContent = "";
      metaBox.textContent = "";
      dataBox.innerHTML = "";

      try {
        const response = await fetch("http://localhost:8080/question", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            history: chatHistory.slice(-HISTORY_WINDOW),
            history_window: HISTORY_WINDOW
          })
        });

        if (!response.ok) {
          const errorBody = await response.text();
          throw new Error(errorBody || `Request failed (${response.status})`);
        }

        const data = await response.json();
        answerBox.textContent = typeof data.answer === "string" ? data.answer : "";
        metaBox.textContent = data.tool_used ? `Tool used: ${data.tool_used}` : "";
        renderStructuredData(data.data);
        if (!answerBox.textContent.trim()) {
          answerBox.textContent = "(empty response)";
        }

        chatHistory.push({ role: "user", content: question });
        chatHistory.push({ role: "assistant", content: answerBox.textContent });
        if (chatHistory.length > HISTORY_WINDOW * 8) {
          chatHistory.splice(0, chatHistory.length - HISTORY_WINDOW * 8);
        }
      } catch (error) {
        answerBox.textContent = `Error: ${error.message}`;
      } finally {
        sendButton.disabled = false;
      }
    }

    sendButton.addEventListener("click", askQuestion);
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") askQuestion();
    });
  </script>
</body>
</html>
